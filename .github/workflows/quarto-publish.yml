# Reusable Quarto build + GitHub Pages deploy for amit.zone sites.
#
# Caller (in the site repo):
#
#   jobs:
#     publish:
#       uses: amit-systems-lab/site-common/.github/workflows/quarto-publish.yml@master
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#
# The Quarto version is pinned HERE, once for all sites. Must be >= 1.7:
# dark mode relies on respect-user-color-scheme and the
# body.quarto-light/quarto-dark classes, which 1.4 lacks (1.4 builds
# render dark backgrounds with light-theme text). Keep in sync with the
# locally installed Quarto version.

name: Publish Quarto Site

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write  # actions/configure-pages reads the Pages site config
    outputs:
      indexnow-body: ${{ steps.indexnow.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive  # site-common is consumed as a submodule

      - name: Setup Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render Quarto Project
        run: quarto render

      # Blocks the deploy on purpose. Both site-breaking bugs shipped here
      # built green -- a pre-render step that stopped writing bib/, and a
      # publication whose PDF was never committed -- because a link and its
      # target live in different places and the target is absent, not
      # changed. Publishing a page with a dead link is the failure; stopping
      # to fix it is cheap.
      - name: Check rendered links
        run: python3 _common/scripts/check_links.py

      # Writes _site/indexnow-manifest.json and, for a site with an IndexNow
      # key file, plans a submission of the URLs that differ from the live
      # site's manifest. The `indexnow` job sends it after the deploy.
      - name: Plan IndexNow submission
        id: indexnow
        run: python3 _common/scripts/indexnow.py

      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tell IndexNow (Bing, Yandex, Seznam, ...) which URLs this deploy changed.
  # Advisory: a rejected or failed submission warns but never fails the run.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow-body != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Submit changed URLs to IndexNow
        env:
          BODY: ${{ needs.build.outputs.indexnow-body }}
        run: |
          sleep 30  # let the new key file and pages reach the Pages CDN
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$BODY" https://api.indexnow.org/indexnow) || code=000
          echo "IndexNow: HTTP $code"; cat resp.txt 2>/dev/null; echo
          case "$code" in
            200|202) ;;
            *) echo "::warning title=IndexNow::submission returned HTTP $code" ;;
          esac
